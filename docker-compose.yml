name: uasnack

x-app-env: &app-env
  APP_ENV: ${APP_ENV:-local}
  DB_CONNECTION: ${DB_CONNECTION}
  DB_HOST: db
  DB_PORT: 5432
  DB_DATABASE: ${DB_DATABASE}
  DB_USERNAME: ${DB_USERNAME}
  DB_PASSWORD: ${DB_PASSWORD}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  MONGODB_URI: mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@mongodb:27017/${MONGO_DATABASE}?authSource=${MONGO_DATABASE}
  MONGODB_DATABASE: ${MONGO_DATABASE}
  CACHE_STORE: redis
  SESSION_DRIVER: ${SESSION_DRIVER}
  QUEUE_CONNECTION: redis

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: development
    image: uasnack/app:dev
    container_name: uasnack_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html:cached
      - vendor-data:/var/www/html/vendor
    environment:
      <<: *app-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      mongodb:
        condition: service_started
    networks:
      - uasnack_net

  webserver:
    image: nginx:1.27-alpine
    container_name: uasnack_nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - .:/var/www/html:cached
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - uasnack_net

  db:
    image: postgres:18
    container_name: uasnack_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_FORWARD_PORT:-5432}:5432"
    volumes:
      - uasnack-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - uasnack_net

  redis:
    image: redis:7-alpine
    container_name: uasnack_redis
    restart: unless-stopped
    volumes:
      - uasnack-redis:/data
    networks:
      - uasnack_net

  mongodb:
    image: mongo:7
    container_name: uasnack_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}
      MONGO_APP_USERNAME: ${MONGO_USERNAME}
      MONGO_APP_PASSWORD: ${MONGO_PASSWORD}
    ports:
      - "${MONGO_FORWARD_PORT:-27017}:27017"
    volumes:
      - uasnack-mongo-data:/data/db
      - ./docker/mongo/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - uasnack_net

  mailpit:
    image: axllent/mailpit:latest
    container_name: uasnack_mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
    networks:
      - uasnack_net

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: development
    image: uasnack/app:dev
    container_name: uasnack_queue
    restart: unless-stopped
    command: php artisan queue:work --tries=3 --backoff=5
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html:cached
      - vendor-data:/var/www/html/vendor
    environment:
      <<: *app-env
    depends_on:
      - app
      - redis
    networks:
      - uasnack_net

networks:
  uasnack_net:
    driver: bridge

volumes:
  uasnack-postgres:
  uasnack-redis:
  uasnack-mongo-data:
  vendor-data:
